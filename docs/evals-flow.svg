<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 1080" width="980" height="1080" role="img" aria-labelledby="t d">
  <title id="t">Promptfoo eval and red-team flow</title>
  <desc id="d">Two lanes. The routing eval sends cold single-turn requests from a labelled CSV corpus to the running API, asserts on the returned intent, and produces a confusion matrix whose triage feeds back either to the corpus or to the router. The red-team lane generates attack cases with a local model, then replays them against the same API carrying a session id across turns.</desc>

  <style>
    svg {
      --ground:  #FFFFFF;
      --surface: #FFFFFF;
      --stroke:  #5A6B70;
      --line:    #C9D2D0;
      --ink:     #131A1C;
      --faint:   #637376;
      --ember:   #B3401A;
      --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, "DejaVu Sans Mono", monospace;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --ground:  #0E1416;
        --surface: #161E21;
        --stroke:  #8FA3A8;
        --line:    #2C393D;
        --ink:     #E6EDEC;
        --faint:   #90A2A6;
        --ember:   #F0764A;
      }
    }

    .bg    { fill: var(--ground); }
    .box   { fill: var(--surface); stroke: var(--stroke); stroke-width: 1.25; }
    .group { fill: none; stroke: var(--line); stroke-width: 1.25; stroke-dasharray: 5 4; }
    .store { fill: var(--surface); stroke: var(--stroke); stroke-width: 1.25; stroke-dasharray: 3 3; }
    .em    { fill: var(--surface); stroke: var(--ember); stroke-width: 1.25; }

    .l      { stroke: var(--stroke); stroke-width: 1.25; fill: none; }
    .l-dash { stroke: var(--stroke); stroke-width: 1.1;  fill: none; stroke-dasharray: 4 4; }
    .l-fb   { stroke: var(--stroke); stroke-width: 1.1;  fill: none; stroke-dasharray: 9 5; }
    .l-em   { stroke: var(--ember);  stroke-width: 1.25; fill: none; }
    .hair   { stroke: var(--line);   stroke-width: 1;    fill: none; }

    .mk    { fill: var(--stroke); }
    .mk-em { fill: var(--ember); }

    text   { font-family: var(--mono); fill: var(--ink); }
    .t     { font-size: 12.5px; }
    .t-sub { font-size: 10.5px; fill: var(--faint); }
    .t-sm  { font-size: 11px; fill: var(--faint); }
    .t-em  { font-size: 12.5px; fill: var(--ember); }
    .t-lbl { font-size: 10.5px; fill: var(--faint); letter-spacing: 0.1em; }
  </style>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="mk" d="M 0 1 L 9 5 L 0 9 z"/>
    </marker>
    <marker id="ar-em" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="mk-em" d="M 0 1 L 9 5 L 0 9 z"/>
    </marker>
    <marker id="ar-sm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="mk" d="M 0 1 L 9 5 L 0 9 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="980" height="1080"/>

  <!-- =================== LANE A: ROUTING EVAL =================== -->
  <rect class="group" x="40" y="60" width="900" height="500" rx="4"/>
  <text class="t-lbl" x="54" y="78">ROUTING EVAL</text>

  <!-- inputs -->
  <rect class="store" x="70" y="110" width="170" height="36" rx="3"/>
  <text class="t" x="155" y="128" text-anchor="middle" dominant-baseline="middle">routing_cases.csv</text>

  <rect class="store" x="70" y="170" width="170" height="36" rx="3"/>
  <text class="t" x="155" y="188" text-anchor="middle" dominant-baseline="middle">config.yaml</text>

  <path class="l-dash" d="M 240 128 L 285 128 L 285 155 L 324 155" marker-end="url(#ar-sm)"/>
  <path class="l-dash" d="M 240 188 L 285 188 L 285 155"/>

  <!-- runner -->
  <rect class="box" x="330" y="130" width="200" height="50" rx="3"/>
  <text class="t" x="430" y="149" text-anchor="middle" dominant-baseline="middle">promptfoo eval</text>
  <text class="t-sub" x="430" y="166" text-anchor="middle" dominant-baseline="middle">57 cases</text>

  <!-- system under test -->
  <rect class="box" x="700" y="130" width="200" height="50" rx="3"/>
  <text class="t" x="800" y="149" text-anchor="middle" dominant-baseline="middle">uvicorn :8000</text>
  <text class="t-sub" x="800" y="166" text-anchor="middle" dominant-baseline="middle">deterministic</text>

  <line class="l" x1="534" y1="146" x2="694" y2="146" marker-end="url(#ar)"/>
  <text class="t-sub" x="614" y="136" text-anchor="middle">POST message</text>
  <line class="l" x1="694" y1="168" x2="534" y2="168" marker-end="url(#ar)"/>
  <text class="t-sub" x="614" y="190" text-anchor="middle">intent + response</text>
  <text class="t-sub" x="614" y="206" text-anchor="middle">no session_id &#183; cold turn</text>

  <rect class="store" x="700" y="240" width="200" height="38" rx="3"/>
  <text class="t" x="800" y="259" text-anchor="middle" dominant-baseline="middle">app/intents.py</text>
  <line class="l-dash" x1="800" y1="234" x2="800" y2="186" marker-end="url(#ar-sm)"/>

  <!-- assertions and results -->
  <line class="l" x1="430" y1="180" x2="430" y2="234" marker-end="url(#ar)"/>

  <rect class="box" x="330" y="240" width="200" height="50" rx="3"/>
  <text class="t" x="430" y="259" text-anchor="middle" dominant-baseline="middle">assert x3</text>
  <text class="t-sub" x="430" y="276" text-anchor="middle" dominant-baseline="middle">intent / caveat / non-empty</text>

  <line class="l" x1="430" y1="290" x2="430" y2="324" marker-end="url(#ar)"/>

  <rect class="box" x="330" y="330" width="200" height="40" rx="3"/>
  <text class="t" x="430" y="350" text-anchor="middle" dominant-baseline="middle">results + view</text>

  <line class="l" x1="430" y1="370" x2="430" y2="404" marker-end="url(#ar)"/>

  <rect class="box" x="330" y="410" width="200" height="40" rx="3"/>
  <text class="t" x="430" y="430" text-anchor="middle" dominant-baseline="middle">confusion matrix</text>

  <line class="l" x1="430" y1="450" x2="430" y2="484" marker-end="url(#ar)"/>

  <rect class="box" x="330" y="490" width="200" height="40" rx="3"/>
  <text class="t" x="430" y="510" text-anchor="middle" dominant-baseline="middle">triage</text>

  <!-- feedback: label wrong -> corpus -->
  <path class="l-fb" d="M 330 510 L 58 510 L 58 128 L 64 128" marker-end="url(#ar-sm)"/>
  <text class="t-sub" x="196" y="500" text-anchor="middle">label wrong</text>

  <!-- feedback: router wrong -> code -->
  <path class="l-fb" d="M 530 510 L 920 510 L 920 259 L 906 259" marker-end="url(#ar-sm)"/>
  <text class="t-sub" x="726" y="500" text-anchor="middle">router wrong</text>

  <!-- =================== LANE B: RED TEAM =================== -->
  <rect class="group" x="40" y="610" width="900" height="380" rx="4"/>
  <text class="t-lbl" x="54" y="628">RED TEAM</text>

  <rect class="store" x="70" y="660" width="170" height="36" rx="3"/>
  <text class="t" x="155" y="678" text-anchor="middle" dominant-baseline="middle">redteam.yaml</text>
  <path class="l-dash" d="M 240 678 L 324 678" marker-end="url(#ar-sm)"/>

  <rect class="box" x="330" y="655" width="200" height="46" rx="3"/>
  <text class="t" x="430" y="678" text-anchor="middle" dominant-baseline="middle">redteam generate</text>

  <rect class="em" x="700" y="655" width="200" height="46" rx="3"/>
  <text class="t-em" x="800" y="678" text-anchor="middle" dominant-baseline="middle">ollama</text>
  <line class="l-em" x1="534" y1="678" x2="694" y2="678" marker-start="url(#ar-em)" marker-end="url(#ar-em)"/>

  <line class="l" x1="430" y1="701" x2="430" y2="734" marker-end="url(#ar)"/>

  <rect class="store" x="330" y="740" width="200" height="38" rx="3"/>
  <text class="t" x="430" y="759" text-anchor="middle" dominant-baseline="middle">generated.yaml</text>

  <line class="l" x1="430" y1="778" x2="430" y2="814" marker-end="url(#ar)"/>

  <rect class="box" x="330" y="820" width="200" height="46" rx="3"/>
  <text class="t" x="430" y="843" text-anchor="middle" dominant-baseline="middle">redteam run</text>

  <rect class="box" x="700" y="820" width="200" height="46" rx="3"/>
  <text class="t" x="800" y="843" text-anchor="middle" dominant-baseline="middle">uvicorn :8000</text>

  <line class="l" x1="534" y1="834" x2="694" y2="834" marker-end="url(#ar)"/>
  <line class="l" x1="694" y1="854" x2="534" y2="854" marker-end="url(#ar)"/>
  <text class="t-sub" x="614" y="876" text-anchor="middle">session_id carried &#183; multi-turn</text>

  <line class="l" x1="430" y1="866" x2="430" y2="920" marker-end="url(#ar)"/>

  <rect class="box" x="330" y="926" width="200" height="40" rx="3"/>
  <text class="t" x="430" y="946" text-anchor="middle" dominant-baseline="middle">report</text>

  <!-- =================== legend =================== -->
  <line class="hair" x1="40" y1="1016" x2="940" y2="1016"/>

  <line class="l" x1="48" y1="1046" x2="84" y2="1046" marker-end="url(#ar-sm)"/>
  <text class="t-sm" x="92" y="1046" dominant-baseline="middle">control flow</text>

  <line class="l-dash" x1="216" y1="1046" x2="252" y2="1046" marker-end="url(#ar-sm)"/>
  <text class="t-sm" x="260" y="1046" dominant-baseline="middle">reads / writes</text>

  <line class="l-fb" x1="392" y1="1046" x2="428" y2="1046" marker-end="url(#ar-sm)"/>
  <text class="t-sm" x="436" y="1046" dominant-baseline="middle">feedback</text>

  <line class="l-em" x1="536" y1="1046" x2="572" y2="1046" marker-end="url(#ar-em)"/>
  <text class="t-sm" x="580" y="1046" dominant-baseline="middle">model path</text>

  <rect class="store" x="716" y="1038" width="26" height="16" rx="2"/>
  <text class="t-sm" x="750" y="1046" dominant-baseline="middle">file on disk</text>
</svg>
